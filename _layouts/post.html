---
layout: default
---
{% assign s = site.data.sections | where: "key", page.section | first %}
<article class="wrap narrow block">
  <p class="crumb"><a href="{{ s.url | relative_url }}">{{ s.title }}</a></p>
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="byline">
    <time datetime="{{ page.date | date_to_xmlschema }}">Đăng {{ page.date | date: "%d/%m/%Y" }}</time>
    {% if page.updated %}<span>Cập nhật {{ page.updated }}</span>{% endif %}
  </p>
  <div class="prose">
    {{ content }}
  </div>
</article>
